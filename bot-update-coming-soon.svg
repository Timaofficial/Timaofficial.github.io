<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
  <rect width="800" height="580" fill="#0f0f0f"/>
  <rect x="10" y="10" width="780" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g id="loading">
    <g transform="translate(400,240)">
      <circle r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
      <circle r="40" fill="none" stroke="#FFD700" stroke-width="3"
              stroke-dasharray="60 200" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="400" y="320" text-anchor="middle" fill="#99AAB5"
          font-family="sans-serif" font-size="18" font-weight="bold">
      Загрузка...
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>

    <text x="400" y="350" text-anchor="middle" fill="#FFD700"
          font-family="monospace" font-size="20" font-weight="bold">
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.6s" begin="0s" repeatCount="indefinite"/>
        •
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
        •
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
        •
      </tspan>
    </text>

    <rect x="200" y="400" width="400" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
    <rect x="200" y="400" width="0" height="6" rx="3" fill="#FFD700">
      <animate attributeName="width" values="0;400" dur="1.2s" begin="0s" fill="freeze"/>
    </rect>
  </g>

  <animate attributeName="opacity" values="1;0" dur="0.2s" begin="1.3s" fill="freeze"
           xlink:href="#loading" xmlns:xlink="http://www.w3.org/1999/xlink"/>

  <g id="blurredContent" opacity="0" filter="url(#blurFilter)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>

    <text x="400" y="55" text-anchor="middle" fill="#00FF88"
          font-family="sans-serif" font-size="28" font-weight="bold">
      Обновление v3.5.0
    </text>

    <text x="400" y="85" text-anchor="middle" fill="#99AAB5"
          font-family="sans-serif" font-size="14">
      Что нового в Arcy Bot
    </text>

    <line x1="50" y1="105" x2="750" y2="105" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g fill="rgba(255,255,255,0.35)">
      <rect x="50" y="135" width="520" height="12" rx="2"/>
      <rect x="50" y="165" width="620" height="12" rx="2"/>
      <rect x="50" y="195" width="450" height="12" rx="2"/>
      <rect x="50" y="225" width="580" height="12" rx="2"/>
      <rect x="50" y="255" width="490" height="12" rx="2"/>
      <rect x="50" y="285" width="660" height="12" rx="2"/>
      <rect x="50" y="315" width="410" height="12" rx="2"/>
      <rect x="50" y="345" width="550" height="12" rx="2"/>
      <rect x="50" y="375" width="600" height="12" rx="2"/>
      <rect x="50" y="405" width="470" height="12" rx="2"/>
    </g>

    <text x="400" y="540" text-anchor="middle" fill="rgba(255,255,255,0.2)"
          font-family="sans-serif" font-size="11">
      Arcy Bot v3.5.0
    </text>
  </g>

  <g id="spoiler" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>

    <rect x="50" y="105" width="700" height="430" rx="8"
          fill="rgba(10,10,10,0.88)"/>

    <rect x="50" y="105" width="700" height="430" rx="8"
          fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="1.5"
          stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24"
               dur="2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(400,255)">
      <path d="M -14 -10 Q -14 -25 0 -25 Q 14 -25 14 -10"
            fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-18" y="-10" width="36" height="28" rx="4"
            fill="none" stroke="#FFD700" stroke-width="2.5"/>
      <circle cx="0" cy="4" r="3" fill="#FFD700">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="45" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.2">
        <animate attributeName="r" values="45;55;45" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="400" y="320" text-anchor="middle" fill="#FFD700"
          font-family="sans-serif" font-size="26" font-weight="bold"
          letter-spacing="4">
      СПОЙЛЕР
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="400" y="358" text-anchor="middle" fill="#99AAB5"
          font-family="sans-serif" font-size="14">
      Доступ откроется позже
    </text>

    <text x="400" y="410" text-anchor="middle" fill="#FFD700"
          font-family="monospace" font-size="32" font-weight="bold"
          letter-spacing="6">
      ?? : ?? : ??
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </text>

    <text x="400" y="460" text-anchor="middle" fill="rgba(255,215,0,0.5)"
          font-family="monospace" font-size="16" font-weight="bold">
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
        •
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
        •
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
        •
      </tspan>
    </text>
  </g>

  <defs>
    <filter id="blurFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
</svg>
